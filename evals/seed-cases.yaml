schema_version: 3
description: Adaptive Dev control-plane routing regression cases.

cases:
  - id: tiny-readme-command
    prompt: "README 里把 npm 改成 pnpm"
    expected_classification:
      risk: L0
      mode: implement
      scope: local
      uncertainty: low
      pattern_familiarity: known|unknown
      profiles: [docs]
    expected_routing:
      spec_system: none
      execution_engine: local
      process_depth: direct
      strategy_id: quick-change
      required_skills: []
    expected_design_control:
      policy: none
      review: none
      documentation_topology: compact
    expected_claim_requested: none
    expected_no:
      - no context-grounding
      - no specflow
      - no project-harness-init

  - id: tiny-css-spacing
    prompt: "把按钮间距调大 4px"
    expected_classification:
      risk: L0
      mode: implement
      scope: local
      uncertainty: low
      pattern_familiarity: known
      profiles: [frontend]
    expected_routing:
      spec_system: none
      execution_engine: local
      process_depth: direct
      strategy_id: quick-change
      required_skills: []
    expected_design_control:
      policy: none
      review: none
      documentation_topology: compact
    expected_claim_requested: none
    expected_no:
      - no unit test by default
      - no complex strategy

  - id: small-login-bug
    prompt: "修登录按钮点击没反应"
    expected_classification:
      risk: L2
      mode: debug
      scope: module
      uncertainty: medium|high
      pattern_familiarity: unknown
      profiles: [frontend]
    expected_routing:
      spec_system: none
      execution_engine: local
      process_depth: selective
      strategy_id: root-cause-debug
      required_skills: [superpowers:systematic-debugging]
    expected_design_control:
      policy: embedded
      review: self
      documentation_topology: compact
    expected_claim_requested: none
    expected_no:
      - no handoff claim
      - no broad redesign

  - id: sop-guided-existing-project
    prompt: "项目已有 AGENTS.md、.agent/skills/orders/SKILL.md 和 testing.md。按现有订单筛选 SOP 增加组合筛选，涉及筛选面板、URL query 持久化和前端筛选状态 selector；覆盖空值、刷新恢复、旧链接兼容，并复用既有测试命令。"
    expected_classification:
      risk: L2
      mode: implement
      scope: module|cross_module
      uncertainty: low|medium
      pattern_familiarity: known|adjacent
      profiles: [frontend]
    expected_routing:
      spec_system: fallback
      execution_engine: local
      process_depth: selective
      strategy_id: sop-guided-iteration
      required_skills: []
    expected_design_control:
      policy: embedded
      review: independent
      documentation_topology: compact
    expected_claim_requested: none
    expected_no:
      - no full SpecFlow lifecycle
      - no Superpowers executing-plans

  - id: sop-guided-small-fix
    prompt: "项目已有 AGENTS.md、.agent/skills/orders/SKILL.md 和 testing.md。按现有 SOP 修正订单列表里一个已知的空状态文案分支，并运行项目规定的 focused validator。"
    expected_classification:
      risk: L1
      mode: implement
      scope: local|module
      uncertainty: low
      pattern_familiarity: known
      profiles: [frontend]
    expected_routing:
      spec_system: none
      execution_engine: local
      process_depth: direct
      strategy_id: sop-guided-change
      required_skills: []
    expected_design_control:
      policy: none
      review: self
      documentation_topology: compact
    expected_claim_requested: none
    expected_no:
      - no workflow manifest
      - no Superpowers skill

  - id: medium-api-contract
    prompt: "给导出接口加 format 参数"
    expected_classification:
      risk: L2
      mode: implement
      scope: module|cross_module
      uncertainty: low|medium
      pattern_familiarity: adjacent|novel|unknown
      profiles: [api]
    expected_routing:
      spec_system: fallback
      execution_engine: superpowers
      process_depth: lifecycle
      strategy_id: complex-real-slice
      required_skills: []
    expected_design_control:
      policy: standalone
      review: independent
      documentation_topology: single_file_design
    expected_claim_requested: none
    expected_no:
      - no unit-only completion claim

  - id: large-permission-model
    prompt: "把用户权限模型从 role 改成 policy"
    expected_classification:
      risk: L3
      mode: implement
      scope: cross_module
      uncertainty: high
      pattern_familiarity: novel|unknown
      profiles: [auth, security, data]
    expected_routing:
      spec_system: fallback
      execution_engine: superpowers
      process_depth: lifecycle
      strategy_id: migration-critical
      required_skills: [context-grounding]
    expected_design_control:
      policy: standalone
      review: human
      documentation_topology: split_design_workspace
    expected_claim_requested: none
    expected_no:
      - no self-review-only completion

  - id: complex-frontend-context-pack
    prompt: "在老项目的订单详情页加一个新审核流，涉及视觉稿、权限状态、已有相似页面、埋点和后端状态流。先别急着改代码，先把需要看的上下文和验收方式梳理清楚。"
    expected_classification:
      risk: L3
      mode: design
      scope: cross_service
      uncertainty: high
      pattern_familiarity: adjacent|unknown
      profiles: [frontend, auth, api]
    expected_routing:
      spec_system: fallback
      execution_engine: none
      process_depth: lifecycle
      strategy_id: complex-real-slice
      required_skills: []
    expected_design_control:
      policy: standalone
      review: independent
      documentation_topology: split_design_workspace
    expected_claim_requested: none
    expected_no:
      - no direct broad implementation

  - id: specflow-intent-to-spec
    prompt: "我有一个新审核流的想法，但还没写清楚目标、边界、验收和测试。先用 SpecFlow 产出 spec，不要开始写代码。"
    expected_classification:
      risk: L2
      mode: design
      scope: module|cross_module
      uncertainty: high
      pattern_familiarity: novel|unknown
      profiles: []
    expected_routing:
      spec_system: fallback
      execution_engine: none
      process_depth: lifecycle
      strategy_id: spec-driven-feature
      required_skills: []
    expected_design_control:
      policy: none|embedded
      review: none|self
      documentation_topology: compact
    expected_claim_requested: none
    expected_no:
      - no production code

  - id: package-handoff
    prompt: "把这个 Python SDK 打成 wheel，保证新项目可以 pip install 后直接 import 使用"
    expected_classification:
      risk: L3
      mode: handoff
      scope: module|cross_module
      uncertainty: medium|high
      pattern_familiarity: adjacent|unknown
      profiles: [release]
    expected_routing:
      spec_system: none|fallback
      execution_engine: superpowers
      process_depth: lifecycle
      strategy_id: complex-real-slice
      required_skills: []
    expected_design_control:
      policy: standalone
      review: independent
      documentation_topology: single_file_design
    expected_claim_requested: none
    expected_no:
      - no producer-tests-only handoff claim

  - id: debug-ci
    prompt: "CI 挂了修一下"
    expected_classification:
      risk: L2
      mode: debug
      scope: cross_module
      uncertainty: high
      pattern_familiarity: unknown
      profiles: [infra]
    expected_routing:
      spec_system: none
      execution_engine: local
      process_depth: selective
      strategy_id: root-cause-debug
      required_skills: [superpowers:systematic-debugging]
    expected_design_control:
      policy: embedded
      review: self
      documentation_topology: compact
    expected_claim_requested: none
    expected_no:
      - no guessing fix

  - id: review-only-no-edit
    prompt: "帮我 review 这个 diff 是否会引入回归，不要修改代码"
    expected_classification:
      risk: L1|L2
      mode: review
      scope: local|module|cross_module
      uncertainty: medium|high
      pattern_familiarity: unknown
      profiles: []
    expected_routing:
      spec_system: none
      execution_engine: none
      process_depth: direct
      strategy_id: review-only
      required_skills: []
    expected_design_control:
      policy: none
      review: independent
      documentation_topology: compact
    expected_claim_requested: none
    expected_no:
      - no implementation

  - id: spike-unknown-architecture
    prompt: "这个旧系统我不熟，先调查一下支付链路怎么走，给我几个可选方案，不要改代码"
    expected_classification:
      risk: L2|L3
      mode: research
      scope: cross_module|cross_service
      uncertainty: high
      pattern_familiarity: unknown
      profiles: [api, data]
    expected_routing:
      spec_system: none
      execution_engine: none
      process_depth: selective
      strategy_id: spike
      required_skills: [context-grounding]
    expected_design_control:
      policy: none
      review: independent
      documentation_topology: compact
    expected_claim_requested: none
    expected_no:
      - no delivery claim

  - id: migration-critical-data
    prompt: "把订单表状态字段迁移为新的状态机，同时保持旧数据可回滚"
    expected_classification:
      risk: L3
      mode: implement
      scope: cross_module
      uncertainty: high
      pattern_familiarity: adjacent|novel|unknown
      profiles: [data]
    expected_routing:
      spec_system: fallback
      execution_engine: superpowers
      process_depth: lifecycle
      strategy_id: migration-critical
      required_skills: [context-grounding]
    expected_design_control:
      policy: standalone
      review: human
      documentation_topology: split_design_workspace
    expected_claim_requested: none
    expected_no:
