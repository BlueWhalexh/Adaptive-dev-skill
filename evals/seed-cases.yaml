  - id: project-harness-init-goal-loop
    prompt: "新项目要做 first MVP vertical slice，以后希望进入目标模式持续迭代，并初始化 docs/spec/plan/evidence、AGENTS.md、agent team 和项目 skill"
    expected_classification:
      risk: L3
      mode: implement
      scope: cross_module
      uncertainty: medium|high
      pattern_familiarity: novel|unknown
      profiles: [docs, infra]
    expected_routing:
      spec_system: fallback
      execution_engine: local
      process_depth: lifecycle
      strategy_id: complex-real-slice
      required_skills: [project-harness-init]
    expected_design_control:
      policy: standalone
      review: independent
      documentation_topology: split_design_workspace
    expected_claim_requested: none
    expected_no:
      - no production-ready claim from scaffold creation

  - id: openspec-project-harness-init
    prompt: "这个仓库已经用 OpenSpec 了，初始化 Goal Loop Mode、AGENTS.md、agent team、项目 skill 和交付 evidence，但不要再生成第二套 product spec/plan"
    expected_classification:
      risk: L3
      mode: implement
      scope: cross_module
      uncertainty: low|medium|high
      pattern_familiarity: adjacent|known|unknown
      profiles: [docs, infra]
    expected_routing:
      spec_system: openspec
      execution_engine: local
      process_depth: lifecycle
      strategy_id: complex-real-slice
      required_skills: [project-harness-init]
    expected_design_control:
      policy: standalone
      review: independent
      documentation_topology: split_design_workspace
    expected_claim_requested: none
    expected_no:
      - no duplicate product spec system

  - id: large-feature-doc-topology
    prompt: "这个 feature 预计两周，涉及前端、API、数据展示和灰度发布。请不要把 spec.md 写胖，按 docs/specs/<feature>、docs/design/<feature>、docs/plans/<feature>.md 和 docs/adr/ 先设计文档分层。"
    expected_classification:
      risk: L3
      mode: implement
      scope: cross_module|cross_service
      uncertainty: medium|high
      pattern_familiarity: novel|unknown
      profiles: [frontend, api, data]
    expected_routing:
      spec_system: fallback|repo_native
      execution_engine: none|superpowers
      process_depth: lifecycle
      strategy_id: complex-real-slice
      required_skills: []
    expected_design_control:
      policy: standalone
      review: independent
      documentation_topology: split_design_workspace
    expected_claim_requested: none
    expected_no:
      - no single swollen spec
