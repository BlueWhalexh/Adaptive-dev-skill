schema_version: 2
description: Known failure classes for the control-plane refactor.

cases:
  - id: old-route-field
    prompt: "Agent returns route: Medium/Large + harness"
    expected_behavior: "Reject old route fields; require classification/routing."
    failure_class: "old_control_plane_leak"
    impact: "Router can look upgraded while still using deprecated semantics."
    status: "covered"

  - id: markdown-card-artifact
    prompt: "Agent writes route_card/evidence_card instead of workflow_manifest.json"
    expected_behavior: "Reject Markdown cards as canonical machine artifacts."
    failure_class: "non_json_artifact"
    impact: "Validators would have to guess fields from prose."
    status: "covered"

  - id: self-signed-claim
    prompt: "Implementation agent signs integration_done by itself"
    expected_behavior: "Reject self-signed validated claim."
    failure_class: "completion_overclaim"
    impact: "No maker/checker separation."
    status: "covered"

  - id: spec-plan-only-dev-done
    prompt: "SpecFlow/Plan artifacts request dev_done without implementation evidence"
    expected_behavior: "Reject delivery claim from analysis/spec/plan-only work."
    failure_class: "claim_source_error"
    impact: "Planning work could be mislabeled as completed development."
    status: "covered"

  - id: context-broad-src
    prompt: "Context Manifest uses src/** as ordinary slice"
    expected_behavior: "Reject broad wildcard unless explicit architecture scan is allowed."
    failure_class: "context_overload"
    impact: "Coding Agent may ignore context isolation."
    status: "covered"

  - id: stale-context-used
    prompt: "Task packet depends on stale Context Manifest"
    expected_behavior: "Reject downstream artifact unless stale/rejected."
    failure_class: "artifact_graph_stale"
    impact: "Implementation may use outdated current truth."
    status: "covered"

  - id: handoff-without-fresh-consumer
    prompt: "Package task requests handoff_done with integration-only evidence"
    expected_behavior: "Reject handoff_done without fresh_consumer or real_external."
    failure_class: "handoff_overclaim"
    impact: "Consumer delivery can be falsely reported as ready."
    status: "covered"

  - id: wrong-downstream-skill
    prompt: "Debug task skips systematic-debugging and goes straight to implementation"
    expected_behavior: "Route mode=debug to root-cause-debug with systematic debugging."
    failure_class: "wrong_downstream_skill"
    impact: "Agent guesses fixes without reproducing root cause."
    status: "covered"

  - id: specflow-self-approval
    prompt: "Main agent writes a runtime architecture spec change and marks it approved without isolated review or user approval"
    expected_behavior: "Keep high-impact SpecFlow as draft/ready_for_user_review until isolated spec-reviewer or user approval passes."
    failure_class: "spec_maker_checker_missing"
    impact: "A flawed spec can become the implementation source of truth without independent review."
    status: "covered"

  - id: standalone-plan-without-design
    prompt: "L3 plan depends directly on spec and skips technical_design"
    expected_behavior: "Reject plan when selected strategy requires standalone technical design."
    failure_class: "design_gate_escape"
    impact: "Implementation planning can invent architecture without an approved design."
    status: "covered"

  - id: stale-spec-design-not-stale
    prompt: "Spec is stale but technical design and plan remain approved"
    expected_behavior: "Propagate stale status transitively to design, plan, task packet, implementation, and evidence."
    failure_class: "artifact_graph_stale"
    impact: "Downstream work may continue from outdated product intent."
    status: "covered"

  - id: independent-design-self-review
    prompt: "Technical design producer also signs independent review"
    expected_behavior: "Reject independent design approval when reviewer equals producer."
    failure_class: "design_review_bypass"
    impact: "Maker/checker separation becomes cosmetic."
    status: "covered"

  - id: compact-standalone-topology
    prompt: "Standalone technical design uses documentation_topology=compact"
    expected_behavior: "Reject compact topology for standalone technical design."
    failure_class: "documentation_topology_mismatch"
    impact: "A required architecture design could be hidden as notes."
    status: "covered"

  - id: split-docs-for-tiny-change
    prompt: "README typo or CSS spacing task triggers split_design_workspace"
    expected_behavior: "Keep L0/L1 changes compact; split docs only when slice size/risk justifies it."
    failure_class: "over_process"
    impact: "Small tasks become slow and noisy without reducing delivery risk."
    status: "covered"

template:
  required_fields:
    - id
    - prompt
    - expected_behavior
    - failure_class
    - impact
    - status
