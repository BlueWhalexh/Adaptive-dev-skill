schema_version: 1
description: Real development failures observed while using adaptive-dev-workflow. Add a case before changing the skill so changes are driven by repeated evidence, not anecdotes.

cases:
  - id: "2026-06-20-workflow-e2e-gap"
    date: "2026-06-20"
    prompt: "skill-judge 评审一下整个工作流 的结果从开始初始化到后续收尾验证 看看问题在哪"
    context: "skill-judge found that the workflow design was good, but repo validation only checked structure and did not prove route cards, evidence cards, or claim-ceiling failures across an initialized project."
    expected_route: "Review-only + skill validation"
    actual_route: "Review-only + skill validation"
    failure_class: "evidence-mismatch"
    expected_behavior:
      - "Workflow eval should fail when Integration Done is supported only by mock evidence."
      - "Workflow eval should fail when Handoff Done lacks fresh consumer or real external evidence."
      - "Workflow eval should validate route/evidence cards after harness initialization."
    actual_behavior:
      - "Existing sandbox eval checked structure, field presence, and line counts only."
      - "Evidence manifest validator used substring checks."
      - "No deterministic workflow E2E eval existed."
    expected_evidence:
      - "Temporary project harness init and validation."
      - "Positive and negative route/evidence card validation."
      - "Positive and negative claim ceiling validation."
    actual_evidence:
      - "Static sandbox eval passed without end-to-end behavior checks."
    impact: "high"
    proposed_minimal_rule: "Add workflow E2E eval, route/evidence card schema, and strict evidence manifest claim-ceiling checks."
    status: "fixed"

  - id: "2026-06-20-fresh-agent-handoff-gap"
    date: "2026-06-20"
    prompt: "现在 E2E 是 deterministic script eval，还不是真正 fresh agent semantic route eval；真实外部 handoff 仍需要具体项目里用 fresh consumer / real external 去证明 实现一下"
    context: "After adding deterministic workflow E2E, the remaining weakness was that route behavior was not tested by fresh agents and package handoff did not have a reusable clean-consumer proof pattern."
    expected_route: "Skill validation + production handoff"
    actual_route: "Skill validation + production handoff"
    failure_class: "handoff-gap"
    expected_behavior:
      - "Route semantics should be testable by fresh agent sessions that do not receive expected answers."
      - "Workflow E2E should include a real clean-consumer artifact install/import proof for package-like handoff."
      - "Docs should state that generic fresh-consumer proof does not replace project-specific real external evidence."
    actual_behavior:
      - "Deterministic eval validated cards and manifests only."
      - "Handoff checks enforced fresh-consumer labels but did not run a clean consumer."
      - "Real external handoff boundary was stated only in review text, not encoded in repo scripts/docs."
    expected_evidence:
      - "Fresh agent route eval script using seed cases without expected-route leakage."
      - "Fresh consumer handoff eval script that builds an artifact and imports it from a clean environment."
      - "Workflow E2E invokes the fresh consumer handoff proof."
    actual_evidence:
      - "Static sandbox eval and deterministic workflow E2E passed."
    impact: "high"
    proposed_minimal_rule: "Add optional fresh agent semantic route eval, default fresh consumer handoff eval, and explicit real-external boundary docs."
    status: "fixed"

template:
  id: "YYYY-MM-DD-short-name"
  date: "YYYY-MM-DD"
  prompt: ""
  context: ""
  expected_route: ""
  actual_route: ""
  failure_class: "over-process | under-process | gate-dilution | evidence-mismatch | docs-drift | missing-harness | completion-overclaim | skill-ambiguity | handoff-gap"
  expected_behavior: []
  actual_behavior: []
  expected_evidence: []
  actual_evidence: []
  impact: ""
  proposed_minimal_rule: ""
  status: "captured | patch-proposed | fixed | rejected"
