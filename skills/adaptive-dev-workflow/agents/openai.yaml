interface:
  display_name: "Adaptive Dev Workflow"
  short_description: "Control-plane router for workflow, design, evidence, claims"
  default_prompt: "Use $adaptive-dev-workflow to classify software work as L0-L3, select strategy/routing/design_control including documentation topology, create or update workflow_manifest.json, call narrow skills for context/spec/technical-design/evidence/learning, validate the artifact graph, and request verifier-signed claims. 用 $adaptive-dev-workflow 为开发、修复、重构、规划、验证、项目初始化、目标模式和交付验收选择最小安全流程。"

policy:
  allow_implicit_invocation: true
