interface:
  display_name: "Adaptive Dev Workflow"
  short_description: "Keep long goals outcome-first and prove Basic Usable early"
  default_prompt: "Use $adaptive-dev-workflow to recover an outcome-uncertain or long-running goal: define Basic Usable, select prove/improve/harden, protect the top blocker from process drift, and choose the next capability-producing action."

policy:
  allow_implicit_invocation: true
