interface:
  display_name: "Agent Orchestration"
  short_description: "Coordinate a bounded Agent Team with isolated context"
  default_prompt: "Use $agent-orchestration only for two independent writers, three or more coordinated roles/sessions, or an explicit orchestrator request. A single maker plus one checker does not trigger it. Keep temporary execution agents, minimal context, isolated writers, and no per-task fan-out."

policy:
  allow_implicit_invocation: true
